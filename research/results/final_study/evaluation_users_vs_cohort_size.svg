<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Warm evaluation users by cohort size</title><desc id="desc">Train-eligible hash prefixes only; historical V2 is a different cohort and is not connected to these lines. Frozen calendar cutoffs; no model metrics.</desc><rect width="900" height="480" fill="white" /><text x="24" y="30" fill="#222" font-family="Arial, sans-serif" font-size="21" text-anchor="start">Warm evaluation users by cohort size</text><text x="24" y="54" fill="#222" font-family="Arial, sans-serif" font-size="13" text-anchor="start">At least five TRAIN positives per domain; fixed global-time cutoffs</text><line x1="110" x2="800" y1="365.0" y2="365.0" stroke="#ddd" /><text x="95" y="369.0" fill="#222" font-family="Arial, sans-serif" font-size="12" text-anchor="end">0</text><line x1="110" x2="800" y1="303.75" y2="303.75" stroke="#ddd" /><text x="95" y="307.75" fill="#222" font-family="Arial, sans-serif" font-size="12" text-anchor="end">500</text><line x1="110" x2="800" y1="242.5" y2="242.5" stroke="#ddd" /><text x="95" y="246.5" fill="#222" font-family="Arial, sans-serif" font-size="12" text-anchor="end">1000</text><line x1="110" x2="800" y1="181.25" y2="181.25" stroke="#ddd" /><text x="95" y="185.25" fill="#222" font-family="Arial, sans-serif" font-size="12" text-anchor="end">1500</text><line x1="110" x2="800" y1="120.0" y2="120.0" stroke="#ddd" /><text x="95" y="124.0" fill="#222" font-family="Arial, sans-serif" font-size="12" text-anchor="end">2000</text><text x="24" y="106" fill="#222" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Evaluation users</text><polyline points="110.0,299.4625 491.97519929140833,214.08 800.0,141.805" fill="none" stroke="#24608a" stroke-width="2" /><line x1="125" x2="150" y1="83" y2="83" stroke="#24608a" stroke-width="3" /><text x="157" y="88" fill="#222" font-family="Arial, sans-serif" font-size="13" text-anch