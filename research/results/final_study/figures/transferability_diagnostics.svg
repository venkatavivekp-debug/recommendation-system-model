<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">Cross-domain transferability diagnostics</title>
<desc id="desc">Separate TRAIN-only activity, transition, representation, neighborhood and pairwise-similarity measures. Display values are rounded; exact values are in transferability_summary.csv. The primary trio has weak transferability; both secondary screens failed the predeclared bidirectional lift gate.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b;letter-spacing:0}.title{font-size:36px;font-weight:700}.sub{font-size:21px;fill:#526170}.header{font-size:20px;font-weight:700}.cell{font-size:24px}.num{text-anchor:end;font-variant-numeric:tabular-nums}.note{font-size:20px;fill:#526170}</style>
<text x="48" y="68" class="title">Transferability diagnostics</text>
<text x="48" y="108" class="sub">Measures are separate; cross-domain lift below 1 means below the destination marginal.</text>
<text x="48" y="142" class="note">i = first domain in the pair; j = second domain. NN and pair-sim use concatenated GMF + MLP representations.</text>
<rect x="40" y="176" width="1520" height="76" fill="#f0f3f5"/>
<text x="48" y="222" class="header">Pair</text>
<text x="1420" y="222" class="header">Status</text>
<text x="365" y="222" class="header num">Users</text>
<text x="490" y="207" class="header num">Activity</text>
<text x="490" y="234" class="header num">Spearman ρ</text>
<text x="620" y="207" class="header num">Lift</text>
<text x="620" y="234" class="header num">i → j</text>
<text x="750" y="207" class="header num">Lift</text>
<text x="750" y="234" class="header num">j → i</text>
<text x="885" y="207" class="header num">GMF</text>
<text x="885" y="234" class="header num">CKA</text>
<text x="1020" y="207" class="header num">MLP</text>
<text x="1020" y="234" class="header num">CKA</text>
<text x="1190" y="207" class="header num">NN overlap</text>
<text x="1190" y="234" class="header num">@10</text>
<text x="1365" y="207" class="header num">Pair-sim</text>
<text x="1365" y="234" class="header num">Spearman ρ</text>
<line x1="40" y1="252" x2="1560" y2="252" stroke="#9aa6b2"/>
<g class="data-row" data-pair="Food-Fitness">
