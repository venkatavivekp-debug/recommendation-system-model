<text x="48" y="654" class="sub">Primary trio: weak transferability.</text>
<text x="48" y="688" class="note">Modest activity associations, all cross-domain lifts &lt;1, low CKA, near-random neighborhoods,</text>
<text x="48" y="718" class="note">and near-zero pair-similarity correlations.</text>
<text x="48" y="764" class="note">Both secondary category pairs failed the predeclared bidirectional lift gate; they were not recommendation benchmarks.</text>
<text x="48" y="812" class="note">Rounded for display only. Exact values: transferability_summary.csv. — = diagnostic not computed.</text>
</svg>
